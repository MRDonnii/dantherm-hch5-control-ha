name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash -n gateway/install.sh
      - run: python -m compileall -q gateway custom_components/hch_passivelink
      - run: pip install pytest pyserial==3.5
      - run: pytest -q
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
